<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — BudgiBook</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-layout">

  <div class="app-content">
    <div class="app-topbar">
      <h1>⚙️ Administration</h1>
    </div>

    <div class="page-content">

      <!-- Statistiques globales -->
      <div class="grid-4" style="margin-bottom:2rem" id="admin-stats">
        <div class="stat-card"><div class="stat-value" id="s-users">—</div><div class="stat-label">Éleveurs inscrits</div></div>
        <div class="stat-card accent"><div class="stat-value" id="s-active">—</div><div class="stat-label">Comptes actifs</div></div>
        <div class="stat-card success"><div class="stat-value" id="s-birds">—</div><div class="stat-label">Oiseaux enregistrés</div></div>
        <div class="stat-card info"><div class="stat-value" id="s-clutches">—</div><div class="stat-label">Nichées</div></div>
      </div>

      <!-- Liste des éleveurs -->
      <div class="card">
        <div class="card-header">
          <h2>👥 Éleveurs inscrits</h2>
          <input type="text" class="filter-input" id="filter-user" placeholder="🔍 Rechercher...">
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Nom / Email</th>
                <th>Région</th>
                <th>Inscription</th>
                <th>Oiseaux</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="6"><div class="empty-state"><p>Chargement...</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/sidebar.js"></script>
<script>
let allUsers = [];

(async () => {
  const user = await requireAdmin('/');
  if (!user) return;
  renderSidebar(user);

  await loadStats();
  await loadUsers();

  document.getElementById('filter-user').addEventListener('input', applyUserFilter);
})();

async function loadStats() {
  try {
    const { stats } = await api('GET', '/api/admin/stats');
    document.getElementById('s-users').textContent    = stats.totalUsers;
    document.getElementById('s-active').textContent   = stats.activeUsers;
    document.getElementById('s-birds').textContent    = stats.totalBirds;
    document.getElementById('s-clutches').textContent = stats.totalClutches;
  } catch {}
}

async function loadUsers() {
  try {
    const { users } = await api('GET', '/api/admin/users');
    allUsers = users;
    renderUsers(users);
  } catch (err) {
    ToastManager.error(err.message);
  }
}

function renderUsers(users) {
  const tbody = document.getElementById('users-tbody');

  if (!users.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon">👥</div><p>Aucun éleveur inscrit.</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = users.map(u => `
    <tr>
      <td>
        <div><strong>${u.farm_name || '—'}</strong></div>
        <div style="font-size:.8rem;color:var(--text-muted)">${u.email}</div>
      </td>
      <td>${u.region || '—'}</td>
      <td>${formatDate(u.created_at)}</td>
      <td style="text-align:center">${u.bird_count}</td>
      <td>
        <span class="badge ${u.is_active ? 'badge-active' : 'badge-deceased'}">
          ${u.is_active ? 'Actif' : 'Désactivé'}
        </span>
      </td>
      <td>
        <div class="table-actions">
          <a href="/eleveur/${u.id}" target="_blank" class="btn btn-ghost btn-sm" title="Voir la vitrine">👁</a>
          <button class="btn btn-ghost btn-sm" onclick="toggleUser(${u.id}, ${u.is_active})"
            title="${u.is_active ? 'Désactiver' : 'Activer'}">
            ${u.is_active ? '🔒' : '🔓'}
          </button>
          <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id}, '${(u.farm_name || u.email).replace(/'/g,"\\'")}')">🗑</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function applyUserFilter() {
  const q = document.getElementById('filter-user').value.toLowerCase();
  const filtered = allUsers.filter(u =>
    (u.farm_name || '').toLowerCase().includes(q) ||
    u.email.toLowerCase().includes(q) ||
    (u.region || '').toLowerCase().includes(q)
  );
  renderUsers(filtered);
}

async function toggleUser(id, currentlyActive) {
  try {
    const { is_active } = await api('PUT', `/api/admin/users/${id}/toggle`);
    ToastManager.success(is_active ? 'Compte activé.' : 'Compte désactivé.');
    await loadUsers();
  } catch (err) {
    ToastManager.error(err.message);
  }
}

function deleteUser(id, name) {
  confirmDialog(
    `Supprimer définitivement le compte de <strong>${name}</strong> et toutes ses données ? Cette action est irréversible.`,
    async () => {
      try {
        await api('DELETE', `/api/admin/users/${id}`);
        ToastManager.success('Compte supprimé.');
        await loadStats();
        await loadUsers();
      } catch (err) {
        ToastManager.error(err.message);
      }
    },
    'Supprimer un compte'
  );
}
</script>
</body>
</html>
