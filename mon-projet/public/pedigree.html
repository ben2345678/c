<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedigree — BudgiBook</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── Arbre généalogique ─────────────────────────────────────────────── */
    .pedigree-tree {
      display: flex;
      align-items: stretch;
      gap: 0;
      min-width: max-content;
      padding: 2rem;
    }

    .pedigree-col {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }

    /* Colonne 1 (sujet) */
    .col-subject { width: 200px; }

    /* Lignes de connexion entre colonnes */
    .pedigree-connector {
      width: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }

    .connector-line {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .connector-line::before {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      width: 48px;
      height: 2px;
      background: var(--border);
      transform: translateY(-50%);
    }

    /* Colonne 2 (parents) */
    .col-parents { width: 200px; }

    /* Colonne 3 (grands-parents) */
    .col-grandparents { width: 200px; }

    .pedigree-node {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .6rem .85rem;
      width: 200px;
      transition: border-color var(--transition);
    }

    .pedigree-node:hover { border-color: var(--primary); }

    .pedigree-node.male   { border-left: 4px solid #1565c0; }
    .pedigree-node.female { border-left: 4px solid #c62828; }
    .pedigree-node.unknown { border-left: 4px solid #9e9e9e; }
    .pedigree-node.subject { border-color: var(--primary); border-width: 3px; }
    .pedigree-node.empty  {
      background: var(--surface-2);
      border: 2px dashed var(--border);
      color: var(--text-muted);
      font-size: .8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pedigree-node-name    { font-weight: 700; font-size: .95rem; }
    .pedigree-node-info    { font-size: .75rem; color: var(--text-muted); margin-top: .1rem; line-height: 1.3; }
    .pedigree-node-sex     { font-size: .7rem; font-weight: 600; }
    .pedigree-node-sex.male   { color: #1565c0; }
    .pedigree-node-sex.female { color: #c62828; }

    /* Lignes verticales de connexion entre nœuds d'un même groupe */
    .v-connector {
      width: 2px;
      background: var(--border);
      flex: 1;
      margin-left: 100px;
      min-height: 10px;
    }

    /* Structure du bloc "duo" (père + mère ou GP) */
    .pair-block {
      display: flex;
      flex-direction: column;
    }

    .pair-spacer { flex: 1; min-height: 20px; }
  </style>
</head>
<body>

<div class="app-layout">

  <div class="app-content">
    <div class="app-topbar">
      <h1>🌳 Pedigree</h1>
    </div>

    <div class="page-content">
      <!-- Sélection de l'oiseau -->
      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-body" style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
          <label for="bird-select" style="font-weight:600;white-space:nowrap">Sélectionner un oiseau :</label>
          <select id="bird-select" class="form-control" style="max-width:320px">
            <option value="">— Choisir un oiseau —</option>
          </select>
          <button class="btn btn-primary" id="btn-load-pedigree">Afficher le pedigree</button>
        </div>
      </div>

      <!-- Légende -->
      <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.85rem">
        <div style="display:flex;align-items:center;gap:.4rem"><div style="width:16px;height:3px;background:#1565c0;border-radius:2px"></div> Mâle</div>
        <div style="display:flex;align-items:center;gap:.4rem"><div style="width:16px;height:3px;background:#c62828;border-radius:2px"></div> Femelle</div>
        <div style="display:flex;align-items:center;gap:.4rem"><div style="width:16px;height:3px;background:#9e9e9e;border-radius:2px"></div> Indéterminé</div>
        <div style="display:flex;align-items:center;gap:.4rem"><div style="width:18px;height:16px;border:2px dashed var(--border);border-radius:3px"></div> Inconnu</div>
      </div>

      <!-- Arbre pedigree -->
      <div class="card">
        <div class="card-body" style="padding:0;overflow-x:auto">
          <div id="pedigree-container">
            <div class="empty-state" style="padding:3rem">
              <div class="empty-state-icon">🌳</div>
              <p>Sélectionnez un oiseau pour afficher son arbre généalogique.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/sidebar.js"></script>
<script>
(async () => {
  const user = await requireLogin('/');
  if (!user || user.role === 'admin') { window.location.href = '/'; return; }
  renderSidebar(user);

  // Charger la liste des oiseaux
  try {
    const { birds } = await api('GET', '/api/birds');
    const select = document.getElementById('bird-select');
    birds.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = `${b.name}${b.mutation ? ' — ' + b.mutation : ''}${b.sex !== 'unknown' ? ' (' + (b.sex === 'male' ? '♂' : '♀') + ')' : ''}`;
      select.appendChild(opt);
    });
  } catch {}

  document.getElementById('btn-load-pedigree').onclick = loadPedigree;

  // Si un paramètre ?id est présent dans l'URL, charger directement
  const params = new URLSearchParams(window.location.search);
  const preId  = params.get('id');
  if (preId) {
    document.getElementById('bird-select').value = preId;
    await loadPedigree();
  }
})();

async function loadPedigree() {
  const id = document.getElementById('bird-select').value;
  if (!id) { ToastManager.warning('Veuillez sélectionner un oiseau.'); return; }

  try {
    const { pedigree } = await api('GET', `/api/birds/${id}/pedigree`);
    renderPedigree(pedigree);
  } catch (err) {
    ToastManager.error(err.message);
  }
}

/* ── Rendu de l'arbre pedigree ─────────────────────────────────────────────
   Structure : 3 colonnes
     [Sujet] ─── [Parents] ─── [Grands-parents]
*/
function renderPedigree(bird) {
  const container = document.getElementById('pedigree-container');

  // Construire l'arbre sous forme HTML pur
  // La structure est : 4 paires de grands-parents, regroupées en 2 parents, eux-mêmes liés au sujet

  const html = `
    <div class="pedigree-tree">

      <!-- Colonne 1 : Sujet -->
      <div class="pedigree-col col-subject" style="justify-content:center">
        ${nodeHTML(bird, true)}
      </div>

      <!-- Connecteur 1 → 2 -->
      <div style="width:48px;display:flex;flex-direction:column;justify-content:center;align-items:center">
        <svg width="48" height="120" viewBox="0 0 48 120">
          <!-- ligne vers père -->
          <line x1="0" y1="60" x2="24" y2="60" stroke="var(--border)" stroke-width="2"/>
          <line x1="24" y1="30" x2="24" y2="90" stroke="var(--border)" stroke-width="2"/>
          <line x1="24" y1="30" x2="48" y2="30" stroke="var(--border)" stroke-width="2"/>
          <line x1="24" y1="90" x2="48" y2="90" stroke="var(--border)" stroke-width="2"/>
        </svg>
      </div>

      <!-- Colonne 2 : Parents -->
      <div class="pedigree-col col-parents" style="gap:40px">
        ${nodeHTML(bird.father, false, '(Père inconnu)')}
        ${nodeHTML(bird.mother, false, '(Mère inconnue)')}
      </div>

      <!-- Connecteur 2 → 3 -->
      <div style="width:48px;display:flex;flex-direction:column">
        ${gpConnectorSVG()}
      </div>

      <!-- Colonne 3 : Grands-parents -->
      <div class="pedigree-col col-grandparents" style="gap:16px">
        ${nodeHTML(bird.father?.father, false, '(Grand-père paternel)')}
        ${nodeHTML(bird.father?.mother, false, '(Grand-mère paternelle)')}
        ${nodeHTML(bird.mother?.father, false, '(Grand-père maternel)')}
        ${nodeHTML(bird.mother?.mother, false, '(Grand-mère maternelle)')}
      </div>

    </div>`;

  container.innerHTML = html;
}

function gpConnectorSVG() {
  // SVG pour relier 2 parents à 4 grands-parents
  return `
    <svg width="48" height="260" viewBox="0 0 48 260" style="flex-shrink:0">
      <!-- Ligne verticale centrale -->
      <line x1="24" y1="65" x2="24" y2="195" stroke="var(--border)" stroke-width="2"/>
      <!-- Père → GPP et GPM -->
      <line x1="0" y1="65" x2="24" y2="65" stroke="var(--border)" stroke-width="2"/>
      <line x1="24" y1="48" x2="24" y2="82" stroke="var(--border)" stroke-width="2"/>
      <line x1="24" y1="48" x2="48" y2="48" stroke="var(--border)" stroke-width="2"/>
      <line x1="24" y1="82" x2="48" y2="82" stroke="var(--border)" stroke-width="2"/>
      <!-- Mère → GPM et GP2 -->
      <line x1="0" y1="195" x2="24" y2="195" stroke="var(--border)" stroke-width="2"/>
      <line x1="24" y1="178" x2="24" y2="212" stroke="var(--border)" stroke-width="2"/>
      <line x1="24" y1="178" x2="48" y2="178" stroke="var(--border)" stroke-width="2"/>
      <line x1="24" y1="212" x2="48" y2="212" stroke="var(--border)" stroke-width="2"/>
    </svg>`;
}

function nodeHTML(bird, isSubject = false, emptyLabel = 'Inconnu') {
  if (!bird) {
    return `<div class="pedigree-node empty" style="min-height:60px">${emptyLabel}</div>`;
  }

  const sexClass = { male: 'male', female: 'female', unknown: 'unknown' }[bird.sex] || 'unknown';
  const sexLabel = { male: '♂ Mâle', female: '♀ Femelle', unknown: '— Indéterminé' }[bird.sex] || '';

  return `
    <div class="pedigree-node ${sexClass}${isSubject ? ' subject' : ''}">
      <div class="pedigree-node-sex ${sexClass}">${sexLabel}</div>
      <div class="pedigree-node-name">${bird.name}</div>
      <div class="pedigree-node-info">
        ${bird.mutation || '—'}
        ${bird.ring_number ? `<br>🔖 ${bird.ring_number}` : ''}
        ${bird.birth_date ? `<br>📅 ${formatDate(bird.birth_date)}` : ''}
      </div>
    </div>`;
}
</script>
</body>
</html>
